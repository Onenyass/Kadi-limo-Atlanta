# Netlify detects Next.js automatically and applies its Next.js runtime.
# Values below are preview-safe defaults. Note: on Netlify, variables set in this
# file take precedence over the same variables set in the dashboard, so change
# them here (in a reviewed commit) when the owner approves launch.
[build]
  command = "npm run build"
  publish = ".next"

# Netlify's Next.js adapter. Declared explicitly so it is applied even on sites
# created via the API (dashboard-created sites add it automatically).
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  # Keep every Netlify deploy out of search engines until the owner approves launch.
  NEXT_PUBLIC_SITE_INDEXABLE = "false"
  # Submit the ride-request form to Netlify Forms. The form only shows a success
  # message when Netlify accepts the submission; otherwise it shows an error and
  # a copyable request summary.
  NEXT_PUBLIC_FORM_MODE = "netlify"
  # NEXT_PUBLIC_SITE_URL is optional: Netlify's own URL / DEPLOY_PRIME_URL are used
  # automatically when it is not set (see src/lib/config.ts).

# The X-Robots-Tag noindex header is sent by next.config.ts while
# NEXT_PUBLIC_SITE_INDEXABLE is not "true".
